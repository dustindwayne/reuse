name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/prepare_data.py
      - run: python scripts/benchmark.py --config configs/baseline.yaml
      - run: python scripts/benchmark.py --config configs/structural.yaml
      - run: python scripts/benchmark.py --config configs/residual.yaml
