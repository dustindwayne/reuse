[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reuse"
version = "0.1.0"
description = "Experimental lossless shared storage and exact computation reuse."
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3"]
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]
