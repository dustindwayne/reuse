[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-residual-lm"
version = "0.1.0"
description = "Experimental language modeling with deterministic structural prediction and neural residual computation."
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "PyYAML>=6,<7"]
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]
